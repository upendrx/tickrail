[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tickrail"
description = "Python bindings for the tickrail trading engine: order book, journals, backtests with Python strategies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dynamic = ["version"]

[project.optional-dependencies]
analysis = ["polars>=1.0", "matplotlib>=3.8"]

[tool.maturin]
module-name = "tickrail._tickrail"
python-source = "python"
features = ["pyo3/extension-module"]
